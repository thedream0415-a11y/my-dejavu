<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>데자뷰 - 지식 타임라인 워크스페이스</title>
    <style>
        :root {
            --bg: #f4f7f6; --primary: #1a2a6c; --accent: #00a8ff;
            --card: #ffffff; --text: #333; --border: #e0e0e0;
        }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); margin: 0; color: var(--text); overflow-x: hidden; }
        
        header {
            background: var(--primary); color: white; padding: 10px 25px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; height: 60px; box-sizing: border-box;
        }
        .logo { font-size: 1.5rem; font-weight: 800; cursor: pointer; }
        .nav-btns { display: flex; gap: 10px; }

        main { min-height: calc(100vh - 60px); position: relative; }
        .section { display: none; padding: 30px 20px; max-width: 1100px; margin: 0 auto; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Home View Search */
        .home-toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; gap: 15px; }
        #home-search { padding: 10px 15px; border-radius: 20px; border: 1px solid #ddd; width: 250px; outline: none; font-size: 0.95rem; }
        #home-search:focus { border-color: var(--accent); box-shadow: 0 0 5px rgba(0,168,255,0.2); }

        /* Home View Categories */
        .category-group { background: rgba(0,0,0,0.03); border-radius: 15px; padding: 20px; margin-bottom: 30px; border: 2px dashed transparent; transition: 0.3s; }
        .category-group.drag-over { border-color: var(--accent); background: rgba(0,168,255,0.08); }
        .category-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; }
        .category-title { font-size: 1.2rem; font-weight: 800; color: var(--primary); cursor: pointer; padding: 5px 10px; border-radius: 5px; }
        .category-title:hover { background: #dee2e6; }
        .list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 15px; min-height: 50px; }
        .db-card { background: white; padding: 15px; border-radius: 12px; text-align: center; cursor: grab; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); font-weight: 600; }
        .db-card.hidden { display: none; }

        /* Timeline View */
        #timeline-view { display: none; height: calc(100vh - 60px); width: 100%; background: #121212; overflow: hidden; position: fixed; top: 60px; left: 0; z-index: 500; cursor: grab; }
        #timeline-canvas { width: 100%; height: 100%; }
        .timeline-controls { position: absolute; bottom: 25px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.95); padding: 10px 25px; border-radius: 30px; display: flex; gap: 15px; align-items: center; box-shadow: 0 8px 25px rgba(0,0,0,0.4); z-index: 600; }
        #tl-search { padding: 8px 15px; border-radius: 20px; border: 1px solid #ccc; outline: none; width: 200px; }

        /* Doc View & Editor */
        .year-badge { display: inline-block; background: #e1f5ff; color: #007bbd; padding: 5px 12px; border-radius: 15px; font-weight: 700; margin-bottom: 10px; font-size: 0.9rem; border: 1px solid #b3e5fc; }
        .toolbar { background: #f8f9fa; border: 1px solid #ddd; padding: 10px; display: flex; gap: 8px; border-radius: 8px 8px 0 0; }
        #ed-content { width: 100%; min-height: 450px; padding: 25px; border: 1px solid #ddd; border-radius: 0 0 8px 8px; background: white; outline: none; box-sizing: border-box; line-height: 1.6; }

        /* Modal */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 40px; border-radius: 20px; width: 85%; max-width: 800px; max-height: 85vh; overflow-y: auto; }
        
        .btn-main { background: var(--accent); color: white; border: none; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        .btn-main:hover { opacity: 0.9; transform: translateY(-1px); }
        .auto-link { color: var(--accent); font-weight: bold; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="goHome()">🌀 Déjà Vu</div>
    <div class="nav-btns">
        <button class="btn-main" style="background:#34495e;" onclick="showTimeline()">📅 연도별 보기</button>
        <button class="btn-main" onclick="showEditor()">+ 신규 메모</button>
    </div>
</header>

<main>
    <section id="home-view" class="section" style="display: block;">
        <div class="home-toolbar">
            <input type="text" id="home-search" placeholder="지식 제목 검색..." oninput="filterHomeItems()">
            <button class="btn-main" style="background:#2c3e50;" onclick="addCategory()">+ 카테고리 추가</button>
        </div>
        <div id="category-container"></div>
    </section>

    <section id="doc-view" class="section">
        <div style="background:white; padding:40px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.05);">
            <div id="dv-year-area"></div>
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid var(--primary); padding-bottom:15px; margin-bottom:30px;">
                <h1 id="dv-title" style="margin:0; color:var(--primary);"></h1>
                <button class="btn-main" onclick="editCurrent()">수정하기</button>
            </div>
            <div id="dv-content" style="line-height:1.9; font-size:1.15rem;"></div>
        </div>
    </section>

    <section id="edit-view" class="section">
        <div style="background:white; padding:35px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.05);">
            <div style="display:flex; gap:12px; margin-bottom:20px;">
                <input type="text" id="ed-title" style="flex:2; padding:15px; border:1px solid #ddd; border-radius:10px; font-size:1.1rem;" placeholder="제목을 입력하세요">
                <input type="text" id="ed-year" style="flex:1; padding:15px; border:1px solid #ddd; border-radius:10px; font-size:1.1rem;" placeholder="연도 (예: 1902~2000)">
            </div>
            <div class="toolbar">
                <button onclick="exec('bold')"><b>B</b></button>
                <button onclick="exec('underline')"><u>U</u></button>
                <input type="color" onchange="exec('foreColor', this.value)" title="글자색">
                <input type="color" onchange="exec('hiliteColor', this.value)" value="#ffff00" title="형광펜">
            </div>
            <div id="ed-content" contenteditable="true"></div>
            <div style="margin-top:25px; text-align:right;">
                <button onclick="goHome()" style="margin-right:15px; background:none; border:none; cursor:pointer; font-weight:bold; color:#666;">취소</button>
                <button class="btn-main" id="sv-btn" onclick="save()">지식 저장하기</button>
            </div>
        </div>
    </section>

    <section id="timeline-view">
        <canvas id="timeline-canvas"></canvas>
        <div class="timeline-controls">
            <input type="text" id="tl-search" placeholder="제목 검색..." oninput="drawTimeline()">
            <span style="font-size:0.85rem; color:#666;">휠: 확대/축소 | 드래그: 이동</span>
            <button onclick="goHome()" style="border:none; background:none; cursor:pointer; font-weight:bold; color:var(--primary);">홈으로</button>
        </div>
    </section>
</main>

<div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div id="modal-year-badge" class="year-badge"></div>
        <h2 id="modal-title" style="margin-top:0; color:var(--primary); font-size:1.8rem;"></h2>
        <hr style="border:0; border-top:1px solid #eee; margin:20px 0;">
        <div id="modal-body" style="line-height:1.8; font-size:1.1rem;"></div>
    </div>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbzdzsPGFn4BWe34LvFOzuuBjgxX8yhvMtkccYQh_uXx3QsS7P9rCkmZvqewm7KpUZ-JtA/exec";
    let allData = [];
    let categories = ["지식 저장소"];
    const catColors = { "지식 저장소": "#1a2a6c", "인물": "#00a8ff", "사건": "#e84118", "학습": "#4cd137", "기타": "#8c7ae6" };

    let offsetX = 0, scale = 1.0;
    const canvas = document.getElementById('timeline-canvas');
    const ctx = canvas.getContext('2d');

    async function init() {
        try {
            const res = await fetch(`${API}?list=all`);
            const data = await res.json();
            allData = data.fullData || [];
            const savedCats = [...new Set(allData.map(d => d.category).filter(c => c))];
            if(savedCats.length > 0) categories = savedCats;
            renderHome();
        } catch(e) { console.error("Data Load Error", e); }
    }

    function renderHome() {
        const container = document.getElementById('category-container');
        container.innerHTML = categories.map(cat => `
            <div class="category-group" ondrop="drop(event, '${cat}')" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
                <div class="category-header">
                    <span class="category-title" ondblclick="renameCategory('${cat}')">${cat}</span>
                </div>
                <div class="list-grid">
                    ${allData.filter(d => (d.category || "지식 저장소") === cat)
                        .map(d => `<div class="db-card" draggable="true" ondragstart="drag(event, '${d.title}')" onclick="loadDoc('${d.title}')">${d.title}</div>`).join('')}
                </div>
            </div>
        `).join('');
    }

    function filterHomeItems() {
        const query = document.getElementById('home-search').value.toLowerCase();
        const cards = document.querySelectorAll('.db-card');
        cards.forEach(card => {
            const title = card.innerText.toLowerCase();
            card.classList.toggle('hidden', !title.includes(query));
        });
    }

    function drag(e, title) { e.dataTransfer.setData("title", title); }
    function allowDrop(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
    
    async function drop(e, newCat) {
        e.preventDefault(); e.currentTarget.classList.remove('drag-over');
        const title = e.dataTransfer.getData("title");
        const item = allData.find(d => d.title === title);
        if(!item || item.category === newCat) return;
        item.category = newCat;
        renderHome();
        await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ title, category: newCat }) });
    }

    function addCategory() {
        const name = prompt("새로운 카테고리 이름을 입력하세요:");
        if(name && !categories.includes(name)) { categories.push(name); renderHome(); }
    }

    // [이 부분이 수정되었습니다: 카테고리 수정 시 서버에도 저장]
    async function renameCategory(oldName) {
        const newName = prompt("카테고리 이름을 수정합니다:", oldName);
        if(newName && newName !== oldName) {
            // 1. 로컬 데이터 업데이트
            categories = categories.map(c => c === oldName ? newName : c);
            
            // 2. 해당 카테고리에 속한 모든 지식들의 카테고리 값을 서버에 업데이트
            const targets = allData.filter(d => d.category === oldName);
            targets.forEach(d => d.category = newName);
            
            renderHome();

            // 3. 서버 전송 (순차적으로 업데이트 요청)
            for (const item of targets) {
                await fetch(API, { 
                    method: 'POST', 
                    mode: 'no-cors', 
                    body: JSON.stringify({ title: item.title, category: newName }) 
                });
            }
        }
    }

    async function loadDoc(title) {
        showSection('doc-view');
        const item = allData.find(d => d.title === title);
        document.getElementById('dv-title').innerText = title;
        document.getElementById('dv-year-area').innerHTML = item.year ? `<div class="year-badge">📅 ${item.year}</div>` : "";
        let content = item.content || "내용이 없습니다.";
        allData.forEach(d => {
            if(d.title !== title) {
                const regex = new RegExp(`(${d.title})`, 'g');
                content = content.replace(regex, `<span class="auto-link" onclick="loadDoc('$1')">$1</span>`);
            }
        });
        document.getElementById('dv-content').innerHTML = content;
    }

    function drawTimeline() {
        if (document.getElementById('timeline-view').style.display !== 'block') return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const centerX = canvas.width / 2 + offsetX;
        const yearWidth = 100 * scale; 
        const searchQuery = document.getElementById('tl-search').value.toLowerCase();

        ctx.strokeStyle = "#333"; ctx.fillStyle = "#888"; ctx.font = "12px Arial";
        for (let y = -3000; y <= 2500; y += 100) {
            let x = centerX + (y - 2000) * (yearWidth / 100);
            if (x < 0 || x > canvas.width) continue;
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            ctx.fillText(y + "년", x + 5, canvas.height - 10);
        }

        let yPos = 80;
        allData.forEach(d => {
            if (!d.year) return;
            const years = d.year.match(/\d{3,4}/g);
            if (!years || years.length === 0) return;
            const startYear = parseInt(years[0]);
            const endYear = years.length > 1 ? parseInt(years[1]) : startYear + 1;
            const xStart = centerX + (startYear - 2000) * (yearWidth / 100);
            const xEnd = centerX + (endYear - 2000) * (yearWidth / 100);
            const width = Math.max(Math.abs(xEnd - xStart), 15);

            const isMatch = searchQuery && d.title.toLowerCase().includes(searchQuery);
            ctx.fillStyle = isMatch ? "#ffff00" : (catColors[d.category] || "#00a8ff");
            ctx.globalAlpha = isMatch ? 1 : 0.85;
            
            ctx.fillRect(xStart, yPos, width, 30);
            ctx.fillStyle = "white"; ctx.font = "bold 13px Pretendard";
            ctx.fillText(d.title, xStart, yPos - 8);
            ctx.fillStyle = "#aaa"; ctx.font = "10px Arial";
            ctx.fillText(d.year, xStart, yPos + 42);

            d._tlPos = { x: xStart, y: yPos, w: width, h: 30 };
            yPos = (yPos + 85 > canvas.height - 100) ? 80 : yPos + 85;
        });
    }

    canvas.addEventListener('wheel', e => { e.preventDefault(); scale *= (e.deltaY > 0 ? 0.9 : 1.1); drawTimeline(); }, {passive:false});
    canvas.addEventListener('mousedown', () => canvas.isDragging = true);
    window.addEventListener('mouseup', () => canvas.isDragging = false);
    window.addEventListener('mousemove', e => { if(canvas.isDragging) { offsetX += e.movementX; drawTimeline(); }});
    canvas.addEventListener('click', e => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        allData.forEach(d => {
            if(d._tlPos && mx >= d._tlPos.x && mx <= d._tlPos.x + d._tlPos.w && my >= d._tlPos.y && my <= d._tlPos.y + d._tlPos.h) openModal(d);
        });
    });

    async function save() {
        const title = document.getElementById('ed-title').value.trim();
        const year = document.getElementById('ed-year').value.trim();
        const content = document.getElementById('ed-content').innerHTML;
        if(!title) return alert("제목은 필수입니다.");
        document.getElementById('sv-btn').innerText = "저장 중...";
        await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ title, year, content, category: "지식 저장소" }) });
        location.reload();
    }

    function editCurrent() {
        const title = document.getElementById('dv-title').innerText;
        const item = allData.find(d => d.title === title);
        showSection('edit-view');
        document.getElementById('ed-title').value = title;
        document.getElementById('ed-year').value = item.year || "";
        document.getElementById('ed-content').innerHTML = item.content;
    }

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
        document.getElementById('timeline-view').style.display = 'none';
        document.getElementById(id).style.display = 'block';
    }
    function goHome() { showSection('home-view'); init(); }
    function showEditor() { showSection('edit-view'); document.getElementById('ed-title').value=""; document.getElementById('ed-year').value=""; document.getElementById('ed-content').innerHTML=""; }
    function showTimeline() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight - 60;
        document.getElementById('timeline-view').style.display = 'block';
        drawTimeline();
    }
    function openModal(d) {
        document.getElementById('modal-title').innerText = d.title;
        document.getElementById('modal-year-badge').innerText = d.year ? `📅 ${d.year}` : "";
        document.getElementById('modal-body').innerHTML = d.content;
        document.getElementById('modal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function exec(c, v=null) { document.execCommand(c, false, v); }

    window.onload = init;
</script>
</body>
</html>
