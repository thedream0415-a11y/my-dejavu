<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>데자뷰 - 울트라 워크스페이스</title>
    <style>
        :root {
            --bg: #f4f7f6; --primary: #1a2a6c; --accent: #00a8ff;
            --card: #ffffff; --text: #333; --border: #e0e0e0; --header-text: white;
        }
        body.dark-mode {
            --bg: #121212; --primary: #0a0e27; --accent: #00a8ff;
            --card: #1e1e1e; --text: #e0e0e0; --border: #333; --header-text: #00a8ff;
        }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); margin: 0; color: var(--text); overflow-x: hidden; transition: 0.3s; }
        header { background: var(--primary); color: var(--header-text); padding: 10px 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; height: 60px; box-sizing: border-box; }
        .logo { font-size: 1.2rem; font-weight: 800; cursor: pointer; }
        .nav-btns { display: flex; gap: 5px; }

        .section { display: none; padding: 20px 15px; max-width: 1100px; margin: 0 auto; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 즐겨찾기 섹션 */
        #fav-section { margin-bottom: 30px; display: none; }
        .fav-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }

        .category-group { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 25px; border: 1px solid var(--border); box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .category-title { font-size: 1.1rem; font-weight: 800; color: var(--accent); }
        .list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .db-card { background: var(--card); padding: 18px 10px; border-radius: 12px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); font-weight: 600; cursor: pointer; position: relative; }
        .fav-btn { position: absolute; top: 5px; right: 5px; cursor: pointer; color: #ccc; }
        .fav-btn.active { color: #f1c40f; }

        /* 타임라인 및 그래프 전용 */
        #timeline-view, #graph-view { display: none; height: calc(100vh - 60px); width: 100%; background: #000; position: fixed; top: 60px; left: 0; z-index: 500; }
        #timeline-canvas, #graph-canvas { width: 100%; height: 100%; display: block; }
        .tl-filter-ui { position: absolute; top: 10px; left: 50%; transform: translateX(-50%); background: rgba(255,255,255,0.9); padding: 5px 15px; border-radius: 20px; display: flex; gap: 10px; z-index: 700; font-size: 0.8rem; }

        /* 에디터 툴바 */
        .toolbar { background: #f8f9fa; border: 1px solid #ddd; padding: 10px; display: flex; flex-wrap: wrap; gap: 5px; border-radius: 8px 8px 0 0; }
        .toolbar button, .toolbar select { padding: 5px 8px; border: 1px solid #ccc; background: white; border-radius: 4px; cursor: pointer; }
        #ed-content { width: 100%; min-height: 400px; padding: 20px; border: 1px solid #ddd; border-top: none; border-radius: 0 0 8px 8px; background: white; outline: none; box-sizing: border-box; color: #333; }
        
        /* 목차(TOC) 스타일 */
        #toc-container { position: fixed; right: 20px; top: 100px; width: 180px; background: var(--card); border: 1px solid var(--border); padding: 10px; border-radius: 10px; font-size: 0.85rem; display: none; }

        .btn-main { background: var(--accent); color: white; border: none; padding: 8px 12px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.8rem; }
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); align-items: center; justify-content: center; }
        .modal-content { background: white; padding: 25px; border-radius: 20px; width: 90%; max-width: 500px; color: #333; }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="goHome()">🌀 Déjà Vu</div>
    <div class="nav-btns">
        <button class="btn-main" style="background:#444;" onclick="toggleDarkMode()">🌓</button>
        <button class="btn-main" style="background:#8e44ad;" onclick="showGraph()">🕸️ 맵</button>
        <button class="btn-main" style="background:#34495e;" onclick="showTimeline()">📅 타임</button>
        <button class="btn-main" onclick="showEditor()">+ 메모</button>
    </div>
</header>

<main>
    <section id="home-view" class="section" style="display: block;">
        <div id="fav-section">
            <h3 style="margin-top:0;">⭐️ 즐겨찾기</h3>
            <div id="fav-grid" class="fav-grid"></div>
            <hr style="border:0; border-top:1px solid var(--border); margin:20px 0;">
        </div>
        <div class="home-toolbar">
            <input type="text" id="home-search" placeholder="검색..." oninput="filterHomeItems()" style="padding:10px; border-radius:20px; border:1px solid #ddd; width:200px;">
            <button class="btn-main" onclick="addCategory()">+ 카테고리</button>
            <button class="btn-main" style="background:#27ae60;" onclick="exportData()">💾 백업</button>
        </div>
        <div id="category-container" style="margin-top:20px;"></div>
    </section>

    <!-- 문서 보기 전용 TOC -->
    <div id="toc-container"><strong>목차</strong><div id="toc-list"></div></div>

    <section id="doc-view" class="section">
        <div style="background:white; padding:25px; border-radius:20px; color:#333;">
            <div id="dv-year-area"></div>
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h1 id="dv-title" style="margin:0;"></h1>
                <button class="btn-main" onclick="editCurrent()">수정</button>
            </div>
            <hr>
            <div id="dv-content" style="line-height:1.7;"></div>
        </div>
    </section>

    <section id="edit-view" class="section">
        <input type="text" id="ed-title" placeholder="제목" style="width:100%; padding:10px; margin-bottom:10px;">
        <input type="text" id="ed-year" placeholder="연도 (예: 1950)" style="width:100%; padding:10px; margin-bottom:10px;">
        <div class="toolbar">
            <button onclick="exec('bold')">B</button><button onclick="exec('underline')">U</button>
            <select onchange="exec('fontSize', this.value)"><option value="3">보통</option><option value="5">크게</option></select>
            <input type="color" onchange="exec('foreColor', this.value)">
            <input type="color" onchange="exec('hiliteColor', this.value)" value="#ffffff">
            <button onclick="insertImg()">🖼️ 이미지</button>
            <button onclick="createTable()">📅 표</button>
        </div>
        <div id="ed-content" contenteditable="true" spellcheck="false"></div>
        <button class="btn-main" onclick="save()" style="width:100%; margin-top:10px;">지식 저장</button>
    </section>

    <section id="timeline-view">
        <div class="tl-filter-ui">
            시작: <input type="number" id="start-year" value="-1000" style="width:60px;">
            종료: <input type="number" id="end-year" value="2100" style="width:60px;">
            <button onclick="drawTimeline()">필터 적용</button>
        </div>
        <canvas id="timeline-canvas"></canvas>
    </section>

    <section id="graph-view">
        <canvas id="graph-canvas"></canvas>
        <div style="position:absolute; bottom:20px; color:white; width:100%; text-align:center;">본문 내 자동 연결망 (지식 맵)</div>
    </section>
</main>

<div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="modal-title"></h2>
        <div id="modal-body" style="max-height:300px; overflow-y:auto;"></div>
        <button class="btn-main" onclick="closeModal()" style="width:100%; margin-top:20px;">닫기</button>
    </div>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbzdzsPGFn4BWe34LvFOzuuBjgxX8yhvMtkccYQh_uXx3QsS7P9rCkmZvqewm7KpUZ-JtA/exec";
    let allData = [], categories = ["미분류"], favorites = [];
    const catColors = { "미분류": "#1a2a6c", "인물": "#00a8ff", "사건": "#e84118", "학습": "#4cd137" };

    // 캔버스 관련
    const cvs = document.getElementById('timeline-canvas'); const ctx = cvs.getContext('2d');
    let offsetX = 0, scale = 1.0, isDragging = false, lastX = 0, dragDist = 0;

    async function init() {
        const res = await fetch(`${API}?list=all`);
        const data = await res.json();
        allData = data.fullData || [];
        allData.forEach(d => { if(d.category === "지식 저장소") d.category = "미분류"; });
        const savedCats = [...new Set(allData.map(d => d.category).filter(c => c))];
        if(savedCats.length > 0) categories = savedCats;
        renderHome();
    }

    function renderHome() {
        const container = document.getElementById('category-container');
        const favGrid = document.getElementById('fav-grid');
        const favData = allData.filter(d => favorites.includes(d.title));
        
        document.getElementById('fav-section').style.display = favData.length ? 'block' : 'none';
        favGrid.innerHTML = favData.map(d => renderCard(d)).join('');
        
        container.innerHTML = categories.map(cat => `
            <div class="category-group">
                <div class="category-title" style="color:${catColors[cat] || '#00a8ff'}">${cat}</div>
                <div class="list-grid">${allData.filter(d => d.category === cat).map(d => renderCard(d)).join('')}</div>
            </div>
        `).join('');
    }

    function renderCard(d) {
        const isFav = favorites.includes(d.title) ? 'active' : '';
        return `
            <div class="db-card" onclick="loadDoc('${d.title}')">
                <span class="fav-btn ${isFav}" onclick="event.stopPropagation(); toggleFav('${d.title}')">★</span>
                ${d.title}
            </div>
        `;
    }

    function toggleFav(title) {
        if(favorites.includes(title)) favorites = favorites.filter(t => t !== title);
        else favorites.push(title);
        renderHome();
    }

    function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }

    function exportData() {
        const blob = new Blob([JSON.stringify(allData, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'dejavu_backup.json'; a.click();
    }

    // --- 타임라인 (기존 코드 유지 및 필터 추가) ---
    function showTimeline() {
        cvs.width = window.innerWidth; cvs.height = window.innerHeight - 60;
        document.getElementById('timeline-view').style.display = 'block';
        drawTimeline();
    }

    function drawTimeline() {
        ctx.clearRect(0, 0, cvs.width, cvs.height);
        const centerX = cvs.width / 2 + offsetX;
        const yearWidth = 100 * scale;
        const startF = parseInt(document.getElementById('start-year').value);
        const endF = parseInt(document.getElementById('end-year').value);

        let yPos = 80;
        allData.forEach(d => {
            const yearMatch = d.year ? d.year.match(/\d+/) : null;
            if(!yearMatch) return;
            const y = parseInt(yearMatch[0]);
            if(y < startF || y > endF) return;

            const x = centerX + (y - 2000) * (yearWidth / 100);
            ctx.fillStyle = catColors[d.category] || "#00a8ff";
            ctx.fillRect(x, yPos, 80, 30);
            ctx.fillStyle = "white"; ctx.fillText(d.title, x+5, yPos+18);
            d._tlPos = {x, y: yPos, w: 80, h: 30};
            yPos = (yPos + 50 > cvs.height - 50) ? 80 : yPos + 50;
        });
    }

    // --- 연관 관계 맵 (신규) ---
    function showGraph() {
        const gView = document.getElementById('graph-view');
        gView.style.display = 'block';
        const gCvs = document.getElementById('graph-canvas');
        const gCtx = gCvs.getContext('2d');
        gCvs.width = window.innerWidth; gCvs.height = window.innerHeight - 60;
        
        const nodes = allData.map((d, i) => ({...d, x: Math.random()*gCvs.width, y: Math.random()*gCvs.height}));
        
        function draw() {
            gCtx.clearRect(0,0,gCvs.width,gCvs.height);
            nodes.forEach(n => {
                nodes.forEach(m => {
                    if(n !== m && n.content.includes(m.title)) {
                        gCtx.strokeStyle = "rgba(255,255,255,0.2)";
                        gCtx.beginPath(); gCtx.moveTo(n.x, n.y); gCtx.lineTo(m.x, m.y); gCtx.stroke();
                    }
                });
            });
            nodes.forEach(n => {
                gCtx.fillStyle = catColors[n.category] || "#00a8ff";
                gCtx.beginPath(); gCtx.arc(n.x, n.y, 10, 0, Math.PI*2); gCtx.fill();
                gCtx.fillStyle = "white"; gCtx.fillText(n.title, n.x+12, n.y+4);
            });
        }
        draw();
    }

    // --- 에디터 보강 ---
    function insertImg() { const url = prompt("이미지 주소(URL)를 입력하세요:"); if(url) exec("insertImage", url); }
    function exec(c, v=null) { document.execCommand(c, false, v); }
    function createTable() {
        const r = prompt("행:", "2"), c = prompt("열:", "2");
        let h = "<table border='1' style='width:100%; border-collapse:collapse;'>";
        for(let i=0; i<r; i++){ h+="<tr>"; for(let j=0; j<c; j++) h+="<td>&nbsp;</td>"; h+="</tr>"; }
        exec("insertHTML", h+"</table><p></p>");
    }

    async function loadDoc(title) {
        showSection('doc-view');
        const d = allData.find(x => x.title === title);
        document.getElementById('dv-title').innerText = title;
        document.getElementById('dv-content').innerHTML = d.content;
        
        // TOC 생성
        const headings = document.getElementById('dv-content').querySelectorAll('h1, h2, h3');
        const tocList = document.getElementById('toc-list');
        tocList.innerHTML = "";
        if(headings.length > 0) {
            document.getElementById('toc-container').style.display = 'block';
            headings.forEach((h, i) => {
                h.id = "h-"+i;
                tocList.innerHTML += `<div onclick="document.getElementById('h-${i}').scrollIntoView()" style="cursor:pointer; margin-bottom:5px;">• ${h.innerText}</div>`;
            });
        } else { document.getElementById('toc-container').style.display = 'none'; }
    }

    // 기존 저장/드래그 로직은 최대한 보존 (save 시 카테고리 고정 로직 포함)
    async function save() {
        const title = document.getElementById('ed-title').value;
        const content = document.getElementById('ed-content').innerHTML;
        const year = document.getElementById('ed-year').value;
        const existing = allData.find(x => x.title === title);
        const category = existing ? existing.category : "미분류";
        
        const newData = { title, content, year, category };
        if(existing) Object.assign(existing, newData); else allData.push(newData);
        
        fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(newData) });
        goHome();
    }

    // 공통 유틸
    function showSection(id) { 
        document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
        document.getElementById('timeline-view').style.display = 'none';
        document.getElementById('graph-view').style.display = 'none';
        document.getElementById('toc-container').style.display = 'none';
        document.getElementById(id).style.display = 'block';
    }
    function goHome() { showSection('home-view'); renderHome(); }
    function showEditor() { showSection('edit-view'); }
    function editCurrent() {
        const t = document.getElementById('dv-title').innerText;
        const d = allData.find(x => x.title === t);
        showEditor();
        document.getElementById('ed-title').value = d.title;
        document.getElementById('ed-content').innerHTML = d.content;
        document.getElementById('ed-year').value = d.year || "";
    }
    
    // 타임라인 클릭 (기존 요청 수정사항 유지)
    cvs.addEventListener('click', e => {
        const rect = cvs.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        allData.forEach(d => {
            if(d._tlPos && mx >= d._tlPos.x && mx <= d._tlPos.x + d._tlPos.w && my >= d._tlPos.y && my <= d._tlPos.y + d._tlPos.h) {
                openModal(d);
            }
        });
    });
    function openModal(d) {
        document.getElementById('modal-title').innerText = d.title;
        document.getElementById('modal-body').innerHTML = d.content;
        document.getElementById('modal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }

    window.onload = init;
</script>
</body>
</html>
