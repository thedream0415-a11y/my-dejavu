<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>데자뷰 - 울트라 워크스페이스 (안정화 버전)</title>
    <style>
        :root {
            --bg: #f4f7f6; --primary: #1a2a6c; --accent: #00a8ff;
            --card: #ffffff; --text: #333; --border: #e0e0e0;
        }
        body.dark-mode {
            --bg: #121212; --primary: #0a0e27; --accent: #00a8ff;
            --card: #1e1e1e; --text: #e0e0e0; --border: #333;
        }
        body { font-family: 'Pretendard', sans-serif; background: var(--bg); margin: 0; color: var(--text); transition: 0.3s; overflow-x: hidden; }
        
        header {
            background: var(--primary); color: white; padding: 10px 15px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; height: 60px; box-sizing: border-box;
        }
        .logo { font-size: 1.2rem; font-weight: 800; cursor: pointer; }
        .nav-btns { display: flex; gap: 8px; }

        .section { display: none; padding: 20px 15px; max-width: 1100px; margin: 0 auto; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 즐겨찾기 */
        #fav-section { margin-bottom: 25px; padding: 15px; background: rgba(255, 215, 0, 0.1); border-radius: 15px; border: 1px dashed #ffd700; }

        .category-group { background: var(--card); border-radius: 15px; padding: 15px; margin-bottom: 25px; border: 2px dashed transparent; min-height: 100px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .category-group.drag-over { border-color: var(--accent); background: rgba(0,168,255,0.08); }
        .category-header { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
        .category-title { font-size: 1.1rem; font-weight: 800; cursor: pointer; }

        .list-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .db-card { 
            background: var(--card); padding: 18px 10px; border-radius: 12px; text-align: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); 
            font-weight: 600; cursor: pointer; position: relative;
        }
        .fav-star { position: absolute; top: 5px; right: 8px; color: #ccc; font-size: 1.2rem; }
        .fav-star.active { color: #f1c40f; }

        /* 타임라인 */
        #timeline-view, #graph-view { display: none; height: calc(100vh - 60px); width: 100%; background: #121212; position: fixed; top: 60px; left: 0; z-index: 500; }
        #timeline-canvas, #graph-canvas { width: 100%; height: 100%; display: block; cursor: grab; }
        .tl-controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; gap: 10px; z-index: 600; background: white; padding: 10px; border-radius: 30px; }

        /* 목차 */
        #toc-container { position: fixed; right: 20px; top: 120px; width: 150px; background: var(--card); border: 1px solid var(--border); padding: 12px; border-radius: 12px; font-size: 0.85rem; z-index: 100; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }

        /* 에디터 툴바 */
        .toolbar { background: #f8f9fa; border: 1px solid #ddd; padding: 10px; display: flex; flex-wrap: wrap; gap: 5px; border-radius: 8px 8px 0 0; }
        .toolbar button, .toolbar select { padding: 5px; cursor: pointer; }
        #ed-content { width: 100%; min-height: 400px; padding: 20px; border: 1px solid #ddd; border-top: none; border-radius: 0 0 8px 8px; background: white; outline: none; box-sizing: border-box; line-height: 1.6; color: #333; }
        
        .btn-main { background: var(--accent); color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.85rem; }
        .auto-link { color: var(--accent); font-weight: bold; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="goHome()">🌀 Déjà Vu</div>
    <div class="nav-btns">
        <button class="btn-main" style="background:#444;" onclick="toggleDarkMode()">🌓</button>
        <button class="btn-main" style="background:#8e44ad;" onclick="showGraph()">🕸️ 지식맵</button>
        <button class="btn-main" style="background:#34495e;" onclick="showTimeline()">📅 타임라인</button>
        <button class="btn-main" onclick="showEditor()">+ 메모</button>
    </div>
</header>

<main>
    <!-- 홈 화면 -->
    <section id="home-view" class="section" style="display: block;">
        <div id="fav-section" style="display:none;">
            <h3 style="margin:0 0 10px 0;">⭐ 즐겨찾기</h3>
            <div id="fav-grid" class="list-grid"></div>
        </div>
        <div style="display:flex; justify-content:space-between; margin-bottom:20px; gap:10px;">
            <input type="text" id="home-search" placeholder="검색..." oninput="filterHomeItems()" style="flex:1; padding:10px; border-radius:20px; border:1px solid #ddd;">
            <button class="btn-main" onclick="addCategory()">+ 카테고리</button>
            <button class="btn-main" style="background:#27ae60;" onclick="exportData()">💾 백업</button>
        </div>
        <div id="category-container"></div>
    </section>

    <!-- 문서 보기 -->
    <div id="toc-container" style="display:none;"><strong>📌 목차</strong><div id="toc-list" style="margin-top:8px;"></div></div>
    <section id="doc-view" class="section">
        <div style="background:white; padding:25px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.05); color: #333;">
            <div id="dv-year-area"></div>
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid var(--primary); padding-bottom:10px; margin-bottom:20px;">
                <h1 id="dv-title" style="margin:0;"></h1>
                <button class="btn-main" onclick="editCurrent()">수정</button>
            </div>
            <div id="dv-content"></div>
            <button onclick="goHome()" style="margin-top:30px; background:none; border:none; color:#888; cursor:pointer; font-weight:bold;">← 돌아가기</button>
        </div>
    </section>

    <!-- 에디터 -->
    <section id="edit-view" class="section">
        <div style="background:white; padding:20px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.05);">
            <input type="text" id="ed-title" placeholder="제목" style="width:100%; padding:12px; margin-bottom:10px; box-sizing:border-box; border:1px solid #ddd; border-radius:8px;">
            <input type="text" id="ed-year" placeholder="연도 (예: 1950)" style="width:100%; padding:12px; margin-bottom:10px; box-sizing:border-box; border:1px solid #ddd; border-radius:8px;">
            <div class="toolbar">
                <button onclick="exec('bold')"><b>B</b></button>
                <button onclick="exec('underline')"><u>U</u></button>
                <select onchange="exec('formatBlock', this.value)">
                    <option value="P">본문</option>
                    <option value="H1">제목1</option>
                    <option value="H2">제목2</option>
                </select>
                <input type="color" onchange="exec('foreColor', this.value)" title="글자색">
                <input type="color" onchange="exec('hiliteColor', this.value)" value="#ffffff" title="배경색">
                <button onclick="insertImg()">🖼️ 이미지</button>
                <button onclick="createTable()">📅 표</button>
            </div>
            <div id="ed-content" contenteditable="true" spellcheck="false"></div>
            <div style="margin-top:20px; display:flex; justify-content:space-between;">
                <button onclick="goHome()" style="background:none; border:none; font-weight:bold; color:#666; cursor:pointer;">취소</button>
                <button class="btn-main" onclick="save()">지식 저장</button>
            </div>
        </div>
    </section>

    <!-- 타임라인 & 지식맵 -->
    <section id="timeline-view">
        <canvas id="timeline-canvas"></canvas>
        <div class="tl-controls">
            <input type="number" id="start-year" value="-1000" style="width:60px;"> ~ 
            <input type="number" id="end-year" value="2100" style="width:60px;">
            <button onclick="drawTimeline()">필터</button>
            <button onclick="goHome()">닫기</button>
        </div>
    </section>

    <section id="graph-view">
        <canvas id="graph-canvas"></canvas>
        <button onclick="goHome()" style="position:absolute; top:20px; right:20px;" class="btn-main">닫기</button>
    </section>
</main>

<!-- 모달 -->
<div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <h2 id="modal-title" style="margin-top:0;"></h2>
        <div id="modal-body" style="line-height:1.6; max-height:400px; overflow-y:auto;"></div>
        <button class="btn-main" onclick="closeModal()" style="width:100%; margin-top:20px; background:#666;">닫기</button>
    </div>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbzdzsPGFn4BWe34LvFOzuuBjgxX8yhvMtkccYQh_uXx3QsS7P9rCkmZvqewm7KpUZ-JtA/exec";
    let allData = [], categories = ["미분류"], favorites = [];
    const catColors = { "미분류": "#1a2a6c" };

    // 타임라인 드래그 상태
    let offsetX = 0, scale = 1.0, isDragging = false, lastX = 0, dragDist = 0;
    const canvas = document.getElementById('timeline-canvas');
    const ctx = canvas.getContext('2d');

    async function init() {
        try {
            const res = await fetch(`${API}?list=all`);
            const data = await res.json();
            allData = data.fullData || [];
            allData.forEach(d => { if(d.category === "지식 저장소") d.category = "미분류"; });
            const savedCats = [...new Set(allData.map(d => d.category).filter(c => c))];
            if(savedCats.length > 0) categories = savedCats;
            renderHome();
        } catch(e) { console.error(e); }
    }

    function renderHome() {
        const container = document.getElementById('category-container');
        const favGrid = document.getElementById('fav-grid');
        const favData = allData.filter(d => favorites.includes(d.title));
        
        document.getElementById('fav-section').style.display = favData.length ? 'block' : 'none';
        favGrid.innerHTML = favData.map(d => renderCard(d)).join('');
        
        container.innerHTML = categories.map(cat => `
            <div class="category-group" ondrop="drop(event, '${cat}')" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
                <div class="category-header">
                    <span class="category-title" style="color:${catColors[cat] || '#1a2a6c'}" onclick="renameCategory('${cat}')">${cat} ✏️</span>
                </div>
                <div class="list-grid">${allData.filter(d => (d.category || '미분류') === cat).map(d => renderCard(d)).join('')}</div>
            </div>
        `).join('');
    }

    function renderCard(d) {
        const isFav = favorites.includes(d.title) ? 'active' : '';
        return `
            <div class="db-card" draggable="true" ondragstart="drag(event, '${d.title}')" onclick="loadDoc('${d.title}')">
                <span class="fav-star ${isFav}" onclick="event.stopPropagation(); toggleFav('${d.title}')">★</span>
                ${d.title}
            </div>
        `;
    }

    // 드래그 앤 드롭 로직
    function drag(e, title) { e.dataTransfer.setData("title", title); }
    function allowDrop(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
    function drop(e, newCat) {
        e.preventDefault(); e.currentTarget.classList.remove('drag-over');
        const title = e.dataTransfer.getData("title");
        const item = allData.find(d => d.title === title);
        if(item && item.category !== newCat) {
            item.category = newCat;
            renderHome();
            fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ title, category: newCat }) });
        }
    }

    // 카테고리 수정 (이름 + 색상)
    async function renameCategory(oldName) {
        const input = prompt("수정할 이름과 색상코드를 입력하세요 (예: 인물,#ff0000)", `${oldName},${catColors[oldName] || '#1a2a6c'}`);
        if(input) {
            const [newName, newColor] = input.split(',');
            if(newName) {
                categories = categories.map(c => c === oldName ? newName : c);
                allData.forEach(d => { if(d.category === oldName) d.category = newName; });
                if(newColor) catColors[newName] = newColor;
                renderHome();
                fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ oldCategory: oldName, newCategory: newName }) });
            }
        }
    }

    // 문서 보기 + 하이퍼링크 + 목차
    async function loadDoc(title) {
        showSection('doc-view');
        const item = allData.find(d => d.title === title);
        document.getElementById('dv-title').innerText = title;
        document.getElementById('dv-year-area').innerHTML = item.year ? `<span style="background:#e1f5ff; padding:5px 10px; border-radius:10px; font-weight:bold;">📅 ${item.year}</span>` : "";
        
        let content = item.content || "";
        // 하이퍼링크 처리
        allData.forEach(d => {
            if(d.title !== title && content.includes(d.title)) {
                const regex = new RegExp(d.title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g');
                content = content.replace(regex, `<span class="auto-link" onclick="loadDoc('${d.title}')">${d.title}</span>`);
            }
        });
        document.getElementById('dv-content').innerHTML = content;

        // 목차 생성
        const hTags = document.getElementById('dv-content').querySelectorAll('h1, h2');
        const tocList = document.getElementById('toc-list');
        tocList.innerHTML = "";
        if(hTags.length > 0) {
            document.getElementById('toc-container').style.display = 'block';
            hTags.forEach((h, i) => {
                h.id = "h-anchor-" + i;
                tocList.innerHTML += `<div onclick="document.getElementById('${h.id}').scrollIntoView({behavior:'smooth'})" style="cursor:pointer; padding:3px 0;">• ${h.innerText}</div>`;
            });
        } else { document.getElementById('toc-container').style.display = 'none'; }
    }

    // 타임라인 드래그 & 클릭 복구
    function showTimeline() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight - 60;
        document.getElementById('timeline-view').style.display = 'block';
        drawTimeline();
    }
    
    function handleDown(x) { isDragging = true; lastX = x; dragDist = 0; }
    function handleMove(x) { if(!isDragging) return; offsetX += (x - lastX); dragDist += Math.abs(x - lastX); lastX = x; drawTimeline(); }
    function handleUp() { isDragging = false; }

    canvas.addEventListener('mousedown', e => handleDown(e.clientX));
    window.addEventListener('mousemove', e => handleMove(e.clientX));
    window.addEventListener('mouseup', handleUp);

    canvas.addEventListener('click', e => {
        if(dragDist > 10) return;
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        allData.forEach(d => {
            if(d._tlPos && mx >= d._tlPos.x && mx <= d._tlPos.x + d._tlPos.w && my >= d._tlPos.y && my <= d._tlPos.y + d._tlPos.h) {
                openModal(d);
            }
        });
    });

    function drawTimeline() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const centerX = canvas.width / 2 + offsetX;
        const yearWidth = 100 * scale;
        const startF = parseInt(document.getElementById('start-year').value);
        const endF = parseInt(document.getElementById('end-year').value);

        // 연도선
        ctx.strokeStyle = "#333"; ctx.fillStyle = "#666";
        for (let y = -3000; y <= 2500; y += 100) {
            let x = centerX + (y - 2000) * (yearWidth / 100);
            if (x < -100 || x > canvas.width + 100) continue;
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            ctx.fillText(y + "년", x + 5, canvas.height - 10);
        }

        let yPos = 60;
        allData.forEach(d => {
            if (!d.year) return;
            const y = parseInt(d.year);
            if(isNaN(y) || y < startF || y > endF) return;
            const x = centerX + (y - 2000) * (yearWidth / 100);
            
            ctx.fillStyle = catColors[d.category] || "#1a2a6c";
            ctx.globalAlpha = 0.8;
            if(ctx.roundRect) ctx.roundRect(x, yPos, 100, 35, 5); else ctx.rect(x, yPos, 100, 35);
            ctx.fill();
            ctx.globalAlpha = 1.0; ctx.fillStyle = "white";
            ctx.fillText(d.title, x+5, yPos+20);
            d._tlPos = {x, y: yPos, w: 100, h: 35};
            yPos = (yPos + 80 > canvas.height - 100) ? 60 : yPos + 80;
        });
    }

    // 지식맵 (Network Graph)
    function showGraph() {
        const gView = document.getElementById('graph-view');
        gView.style.display = 'block';
        const gCvs = document.getElementById('graph-canvas');
        const gCtx = gCvs.getContext('2d');
        gCvs.width = window.innerWidth; gCvs.height = window.innerHeight - 60;
        
        const nodes = allData.map(d => ({...d, x: Math.random()*gCvs.width, y: Math.random()*gCvs.height}));
        gCtx.clearRect(0,0,gCvs.width,gCvs.height);
        nodes.forEach(n => {
            nodes.forEach(m => {
                if(n !== m && n.content.includes(m.title)) {
                    gCtx.strokeStyle = "rgba(255,255,255,0.2)";
                    gCtx.beginPath(); gCtx.moveTo(n.x, n.y); gCtx.lineTo(m.x, m.y); gCtx.stroke();
                }
            });
            gCtx.fillStyle = catColors[n.category] || "#00a8ff";
            gCtx.beginPath(); gCtx.arc(n.x, n.y, 8, 0, Math.PI*2); gCtx.fill();
            gCtx.fillStyle = "white"; gCtx.fillText(n.title, n.x+10, n.y+5);
        });
    }

    // 에디터 & 저장
    function showEditor() { showSection('edit-view'); document.getElementById('ed-title').value=""; document.getElementById('ed-year').value=""; document.getElementById('ed-content').innerHTML=""; }
    function editCurrent() {
        const title = document.getElementById('dv-title').innerText;
        const item = allData.find(d => d.title === title);
        showSection('edit-view');
        document.getElementById('ed-title').value = title;
        document.getElementById('ed-year').value = item.year || "";
        document.getElementById('ed-content').innerHTML = item.content;
    }
    async function save() {
        const title = document.getElementById('ed-title').value;
        const existing = allData.find(d => d.title === title);
        const newData = {
            title,
            year: document.getElementById('ed-year').value,
            content: document.getElementById('ed-content').innerHTML,
            category: existing ? existing.category : "미분류"
        };
        if(existing) Object.assign(existing, newData); else allData.push(newData);
        fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify(newData) });
        goHome();
    }

    // 공통 기능
    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
        document.getElementById('timeline-view').style.display = 'none';
        document.getElementById('graph-view').style.display = 'none';
        document.getElementById('toc-container').style.display = 'none';
        document.getElementById(id).style.display = 'block';
    }
    function goHome() { showSection('home-view'); renderHome(); }
    function toggleFav(title) { favorites.includes(title) ? favorites = favorites.filter(t => t !== title) : favorites.push(title); renderHome(); }
    function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }
    function exportData() {
        const blob = new Blob([JSON.stringify(allData, null, 2)], {type: 'application/json'});
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href = url; a.download = 'dejavu_backup.json'; a.click();
    }
    function addCategory() { const name = prompt("새 카테고리명:"); if(name && !categories.includes(name)) { categories.push(name); renderHome(); } }
    function exec(c, v=null) { document.execCommand(c, false, v); }
    function insertImg() { const url = prompt("이미지 URL:"); if(url) exec("insertImage", url); }
    function createTable() {
        const r = prompt("행:", "2"), c = prompt("열:", "2");
        let h = "<table border='1' style='width:100%; border-collapse:collapse;'>";
        for(let i=0; i<r; i++) { h+="<tr>"; for(let j=0; j<c; j++) h+="<td>&nbsp;</td>"; h+="</tr>"; }
        exec("insertHTML", h+"</table><p></p>");
    }
    function openModal(d) { document.getElementById('modal-title').innerText = d.title; document.getElementById('modal-body').innerHTML = d.content; document.getElementById('modal').style.display = 'flex'; }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function filterHomeItems() {
        const q = document.getElementById('home-search').value.toLowerCase();
        document.querySelectorAll('.db-card').forEach(c => c.style.display = c.innerText.toLowerCase().includes(q) ? 'block' : 'none');
    }

    window.onload = init;
</script>
</body>
</html>
