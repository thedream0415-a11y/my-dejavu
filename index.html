<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>데자뷰 - 지식 타임라인 워크스페이스</title>
    <style>
        :root {
            --bg: #f4f7f6; --primary: #1a2a6c; --accent: #00a8ff;
            --card: #ffffff; --text: #333; --border: #e0e0e0;
        }
        body { 
            font-family: 'Pretendard', sans-serif; background: var(--bg); margin: 0; color: var(--text); 
            overflow-x: hidden; touch-action: manipulation;
        }
        
        header {
            background: var(--primary); color: white; padding: 10px 15px;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; height: 60px; box-sizing: border-box;
        }
        .logo { font-size: 1.2rem; font-weight: 800; cursor: pointer; white-space: nowrap; }
        .nav-btns { display: flex; gap: 8px; }

        main { min-height: calc(100vh - 60px); position: relative; }
        .section { display: none; padding: 20px 15px; max-width: 1100px; margin: 0 auto; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* 홈 뷰 검색 및 툴바 */
        .home-toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 10px; }
        #home-search { flex: 1; min-width: 200px; padding: 12px 15px; border-radius: 25px; border: 1px solid #ddd; outline: none; font-size: 1rem; }
        
        /* 카테고리 디자인 */
        .category-group { background: rgba(0,0,0,0.03); border-radius: 15px; padding: 15px; margin-bottom: 25px; border: 2px dashed transparent; }
        .category-group.drag-over { border-color: var(--accent); background: rgba(0,168,255,0.08); }
        .category-header { margin-bottom: 12px; }
        .category-title { font-size: 1.1rem; font-weight: 800; color: var(--primary); padding: 5px; }

        /* 지식 카드 그리드 */
        .list-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
            gap: 12px; min-height: 60px; 
        }
        .db-card { 
            background: white; padding: 18px 10px; border-radius: 12px; text-align: center; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid var(--border); 
            font-weight: 600; font-size: 0.95rem; user-select: none;
        }
        .db-card.hidden { display: none; }

        /* 타임라인 뷰 (터치 최적화) */
        #timeline-view { 
            display: none; height: calc(100vh - 60px); width: 100%; background: #121212; 
            overflow: hidden; position: fixed; top: 60px; left: 0; z-index: 500; touch-action: none; 
        }
        #timeline-canvas { width: 100%; height: 100%; display: block; }
        .timeline-controls { 
            position: absolute; bottom: 20px; left: 5%; right: 5%; 
            background: rgba(255,255,255,0.95); padding: 10px 15px; border-radius: 30px; 
            display: flex; gap: 10px; align-items: center; justify-content: space-between;
            box-shadow: 0 8px 25px rgba(0,0,0,0.4); z-index: 600; 
        }
        #tl-search { flex: 1; padding: 8px 12px; border-radius: 20px; border: 1px solid #ccc; font-size: 0.9rem; }

        /* 에디터 및 문서 보기 */
        .year-badge { display: inline-block; background: #e1f5ff; color: #007bbd; padding: 5px 12px; border-radius: 15px; font-weight: 700; margin-bottom: 10px; font-size: 0.85rem; }
        .toolbar { background: #f8f9fa; border: 1px solid #ddd; padding: 8px; display: flex; gap: 5px; border-radius: 8px 8px 0 0; overflow-x: auto; }
        #ed-content { width: 100%; min-height: 350px; padding: 20px; border: 1px solid #ddd; border-radius: 0 0 8px 8px; background: white; outline: none; box-sizing: border-box; line-height: 1.6; font-size: 1rem; }

        /* 모달 모바일 최적화 */
        .modal { display: none; position: fixed; z-index: 2000; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75); align-items: flex-end; }
        .modal-content { 
            background: white; padding: 30px 20px; border-radius: 20px 20px 0 0; 
            width: 100%; max-height: 85vh; overflow-y: auto; box-sizing: border-box;
        }
        
        .btn-main { background: var(--accent); color: white; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; font-size: 0.9rem; white-space: nowrap; }
        .auto-link { color: var(--accent); font-weight: bold; text-decoration: underline; }

        @media (max-width: 600px) {
            .logo { font-size: 1.1rem; }
            .btn-main { padding: 8px 12px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo" onclick="goHome()">🌀 Déjà Vu</div>
    <div class="nav-btns">
        <button class="btn-main" style="background:#34495e;" onclick="showTimeline()">📅 타임라인</button>
        <button class="btn-main" onclick="showEditor()">+ 메모</button>
    </div>
</header>

<main>
    <section id="home-view" class="section" style="display: block;">
        <div class="home-toolbar">
            <input type="text" id="home-search" placeholder="지식 제목 검색..." oninput="filterHomeItems()">
            <button class="btn-main" style="background:#2c3e50;" onclick="addCategory()">+ 카테고리</button>
        </div>
        <div id="category-container"></div>
    </section>

    <section id="doc-view" class="section">
        <div style="background:white; padding:25px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.05);">
            <div id="dv-year-area"></div>
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:3px solid var(--primary); padding-bottom:10px; margin-bottom:20px;">
                <h1 id="dv-title" style="margin:0; color:var(--primary);"></h1>
                <button class="btn-main" onclick="editCurrent()">수정</button>
            </div>
            <div id="dv-content" style="line-height:1.7; font-size:1.05rem;"></div>
        </div>
    </section>

    <section id="edit-view" class="section">
        <div style="background:white; padding:20px; border-radius:20px; box-shadow:0 10px 30px rgba(0,0,0,0.05);">
            <div style="display:flex; flex-direction:column; gap:10px; margin-bottom:15px;">
                <input type="text" id="ed-title" style="padding:12px; border:1px solid #ddd; border-radius:10px; font-size:1rem;" placeholder="제목">
                <input type="text" id="ed-year" style="padding:12px; border:1px solid #ddd; border-radius:10px; font-size:1rem;" placeholder="연도 (예: 1902~2000)">
            </div>
            <div class="toolbar">
                <button onclick="exec('bold')">B</button>
                <button onclick="exec('underline')">U</button>
                <input type="color" onchange="exec('foreColor', this.value)">
                <input type="color" onchange="exec('hiliteColor', this.value)" value="#ffff00">
            </div>
            <div id="ed-content" contenteditable="true"></div>
            <div style="margin-top:20px; display:flex; justify-content:space-between;">
                <button onclick="goHome()" style="background:none; border:none; font-weight:bold; color:#666;">취소</button>
                <button class="btn-main" id="sv-btn" onclick="save()">지식 저장</button>
            </div>
        </div>
    </section>

    <section id="timeline-view">
        <canvas id="timeline-canvas"></canvas>
        <div class="timeline-controls">
            <input type="text" id="tl-search" placeholder="검색..." oninput="drawTimeline()">
            <button onclick="goHome()" style="border:none; background:none; font-weight:bold; color:var(--primary); padding:5px 10px;">홈</button>
        </div>
    </section>
</main>

<div id="modal" class="modal" onclick="closeModal()">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div id="modal-year-badge" class="year-badge"></div>
        <h2 id="modal-title" style="margin:0 0 15px 0; color:var(--primary);"></h2>
        <div id="modal-body" style="line-height:1.7;"></div>
        <button class="btn-main" onclick="closeModal()" style="width:100%; margin-top:20px; background:#666;">닫기</button>
    </div>
</div>

<script>
    const API = "https://script.google.com/macros/s/AKfycbzdzsPGFn4BWe34LvFOzuuBjgxX8yhvMtkccYQh_uXx3QsS7P9rCkmZvqewm7KpUZ-JtA/exec";
    let allData = [];
    let categories = ["지식 저장소"];
    const catColors = { "지식 저장소": "#1a2a6c", "인물": "#00a8ff", "사건": "#e84118", "학습": "#4cd137", "기타": "#8c7ae6" };

    let offsetX = 0, scale = 1.0;
    const canvas = document.getElementById('timeline-canvas');
    const ctx = canvas.getContext('2d');

    let lastTouchX = 0, lastTouchY = 0, initialPinchDist = 0;

    async function init() {
        try {
            const res = await fetch(`${API}?list=all`);
            const data = await res.json();
            allData = data.fullData || [];
            const savedCats = [...new Set(allData.map(d => d.category).filter(c => c))];
            if(savedCats.length > 0) categories = savedCats;
            renderHome();
        } catch(e) { console.error("Load Error", e); }
    }

    function renderHome() {
        const container = document.getElementById('category-container');
        container.innerHTML = categories.map(cat => `
            <div class="category-group" ondrop="drop(event, '${cat}')" ondragover="allowDrop(event)" ondragleave="dragLeave(event)">
                <div class="category-header">
                    <span class="category-title" ondblclick="renameCategory('${cat}')">${cat}</span>
                </div>
                <div class="list-grid">
                    ${allData.filter(d => (d.category || "지식 저장소") === cat)
                        .map(d => `<div class="db-card" draggable="true" ondragstart="drag(event, '${d.title}')" ontouchstart="touchStart(event, '${d.title}')" ontouchend="touchEnd(event, '${cat}')" onclick="loadDoc('${d.title}')">${d.title}</div>`).join('')}
                </div>
            </div>
        `).join('');
    }

    let touchItem = null;
    function touchStart(e, title) { touchItem = title; }
    function touchEnd(e, currentCat) { 
        if(!touchItem) return;
        setTimeout(() => {
            const move = confirm(`'${touchItem}' 항목을 다른 카테고리로 이동할까요?`);
            if(move) {
                const targetCat = prompt("이동할 카테고리명을 입력하세요:", currentCat);
                if(targetCat && categories.includes(targetCat)) moveItem(touchItem, targetCat);
            }
            touchItem = null;
        }, 500);
    }

    async function moveItem(title, newCat) {
        const item = allData.find(d => d.title === title);
        item.category = newCat;
        renderHome();
        await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ title, category: newCat }) });
    }

    function filterHomeItems() {
        const query = document.getElementById('home-search').value.toLowerCase();
        document.querySelectorAll('.db-card').forEach(card => {
            card.classList.toggle('hidden', !card.innerText.toLowerCase().includes(query));
        });
    }

    function drawTimeline() {
        if (document.getElementById('timeline-view').style.display !== 'block') return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const centerX = canvas.width / 2 + offsetX;
        const yearWidth = 100 * scale; 
        const searchQuery = document.getElementById('tl-search').value.toLowerCase();

        ctx.strokeStyle = "#333"; ctx.fillStyle = "#666"; ctx.font = "10px Arial";
        for (let y = -3000; y <= 2500; y += 100) {
            let x = centerX + (y - 2000) * (yearWidth / 100);
            if (x < -100 || x > canvas.width + 100) continue;
            ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
            ctx.fillText(y + "년", x + 3, canvas.height - 10);
        }

        let yPos = 60;
        allData.forEach(d => {
            if (!d.year) return;
            const years = d.year.match(/\d{1,4}/g);
            if (!years) return;
            const startYear = parseInt(years[0]);
            const endYear = years.length > 1 ? parseInt(years[1]) : startYear + 1;
            const xStart = centerX + (startYear - 2000) * (yearWidth / 100);
            const xEnd = centerX + (endYear - 2000) * (yearWidth / 100);
            const width = Math.max(Math.abs(xEnd - xStart), 20);

            if (xStart + width < 0 || xStart > canvas.width) return;

            const isMatch = searchQuery && d.title.toLowerCase().includes(searchQuery);
            ctx.fillStyle = isMatch ? "#ffff00" : (catColors[d.category] || "#00a8ff");
            ctx.globalAlpha = 0.8;
            ctx.fillRect(xStart, yPos, width, 35);
            
            ctx.globalAlpha = 1.0;
            ctx.fillStyle = "white"; ctx.font = "bold 12px Pretendard";
            ctx.fillText(d.title, xStart + 5, yPos - 5);
            ctx.fillStyle = "#999"; ctx.font = "9px Arial";
            ctx.fillText(d.year, xStart, yPos + 48);

            d._tlPos = { x: xStart, y: yPos, w: width, h: 35 };
            yPos = (yPos + 80 > canvas.height - 100) ? 60 : yPos + 80;
        });
    }

    // --- 수정된 터치 로직 ---
    canvas.addEventListener('touchstart', e => {
        if (e.target === canvas) e.preventDefault();
        if(e.touches.length === 1) {
            lastTouchX = e.touches[0].clientX;
            lastTouchY = e.touches[0].clientY;
        } else if(e.touches.length === 2) {
            initialPinchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
        }
    }, {passive: false});

    canvas.addEventListener('touchmove', e => {
        e.preventDefault(); 
        if(e.touches.length === 1) {
            const moveX = e.touches[0].clientX - lastTouchX;
            offsetX += moveX;
            lastTouchX = e.touches[0].clientX;
            lastTouchY = e.touches[0].clientY;
        } else if(e.touches.length === 2) {
            const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
            const zoomDelta = dist / initialPinchDist;
            scale *= zoomDelta;
            initialPinchDist = dist;
        }
        drawTimeline();
    }, {passive: false});

    canvas.addEventListener('touchend', () => { initialPinchDist = 0; });
    // --- 터치 로직 끝 ---

    canvas.addEventListener('click', e => {
        const rect = canvas.getBoundingClientRect();
        const mx = e.clientX - rect.left, my = e.clientY - rect.top;
        allData.forEach(d => {
            if(d._tlPos && mx >= d._tlPos.x && mx <= d._tlPos.x + d._tlPos.w && my >= d._tlPos.y && my <= d._tlPos.y + d._tlPos.h) openModal(d);
        });
    });

    async function save() {
        const title = document.getElementById('ed-title').value.trim();
        const year = document.getElementById('ed-year').value.trim();
        const content = document.getElementById('ed-content').innerHTML;
        if(!title) return alert("제목을 입력하세요.");
        document.getElementById('sv-btn').innerText = "저장 중...";
        await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ title, year, content, category: "지식 저장소" }) });
        location.reload();
    }

    async function renameCategory(oldName) {
        const newName = prompt("카테고리 이름을 수정합니다:", oldName);
        if(newName && newName !== oldName) {
            categories = categories.map(c => c === oldName ? newName : c);
            const targets = allData.filter(d => d.category === oldName);
            targets.forEach(d => d.category = newName);
            renderHome();
            for (const item of targets) {
                await fetch(API, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ title: item.title, category: newName }) });
            }
        }
    }

    function drag(e, title) { e.dataTransfer.setData("title", title); }
    function allowDrop(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
    function dragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
    function drop(e, newCat) {
        e.preventDefault(); e.currentTarget.classList.remove('drag-over');
        const title = e.dataTransfer.getData("title");
        moveItem(title, newCat);
    }

    async function loadDoc(title) {
        showSection('doc-view');
        const item = allData.find(d => d.title === title);
        document.getElementById('dv-title').innerText = title;
        document.getElementById('dv-year-area').innerHTML = item.year ? `<div class="year-badge">📅 ${item.year}</div>` : "";
        let content = item.content || "내용이 없습니다.";
        allData.forEach(d => {
            if(d.title !== title) {
                const safeTitle = d.title.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                content = content.split(new RegExp(safeTitle, 'g')).join(`<span class="auto-link" onclick="loadDoc('${d.title}')">${d.title}</span>`);
            }
        });
        document.getElementById('dv-content').innerHTML = content;
    }

    function editCurrent() {
        const title = document.getElementById('dv-title').innerText;
        const item = allData.find(d => d.title === title);
        showSection('edit-view');
        document.getElementById('ed-title').value = title;
        document.getElementById('ed-year').value = item.year || "";
        document.getElementById('ed-content').innerHTML = item.content;
    }

    function showSection(id) {
        document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
        document.getElementById('timeline-view').style.display = 'none';
        document.getElementById(id).style.display = 'block';
        window.scrollTo(0,0);
    }
    function goHome() { showSection('home-view'); init(); }
    function showEditor() { showSection('edit-view'); document.getElementById('ed-title').value=""; document.getElementById('ed-year').value=""; document.getElementById('ed-content').innerHTML=""; }
    function showTimeline() {
        canvas.width = window.innerWidth; canvas.height = window.innerHeight - 60;
        document.getElementById('timeline-view').style.display = 'block';
        drawTimeline();
    }
    function openModal(d) {
        document.getElementById('modal-title').innerText = d.title;
        document.getElementById('modal-year-badge').innerText = d.year ? `📅 ${d.year}` : "";
        document.getElementById('modal-body').innerHTML = d.content;
        document.getElementById('modal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('modal').style.display = 'none'; }
    function exec(c, v=null) { document.execCommand(c, false, v); }
    function addCategory() {
        const name = prompt("새로운 카테고리 이름을 입력하세요:");
        if(name && !categories.includes(name)) { categories.push(name); renderHome(); }
    }

    window.onload = init;
</script>
</body>
</html>
